
name: 'build and Test'

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 11.0.x
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal

# 4) Instala la herramienta de SonarScanner para .NET. Si el secreto
    # SONAR_TOKEN no existe, esta parte se omite para que el pipeline no falle.
    - name: Install SonarScanner
      if: ${{ env.SONAR_TOKEN != '' }}
      shell: bash
      run: |
        dotnet tool install --global dotnet-sonarscanner
        echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
    # 5) Si no hay token de SonarCloud configurado, avisamos al usuario pero
    # el flujo sigue funcionando normalmente.
    - name: SonarCloud analysis skipped
      if: ${{ env.SONAR_TOKEN == '' }}
      run: echo "Skipping SonarCloud analysis because SONAR_TOKEN is not configured."

    # 6) Inicia la analítica de SonarCloud antes de compilar para que el
    # análisis cubra la solución completa.
    - name: Begin SonarCloud analysis
      if: ${{ env.SONAR_TOKEN != '' }}
      run: |
        export PATH="$PATH:$HOME/.dotnet/tools"
        dotnet sonarscanner begin \
          /o:"tesisenel" \
          /k:"TesisEnel_UASD_GestionCirugiaPlastica_2026_03" \
          /d:sonar.token="${SONAR_TOKEN}" \
          /d:sonar.host.url="https://sonarcloud.io"
    # 7) Compila la solución en modo Release. El flag --no-restore evita que
    # vuelva a restaurar paquetes ya descargados y acelera la ejecución.
    - name: Build solution
      run: dotnet build --configuration Release --no-restore

    # 8) Ejecuta la suite de pruebas del proyecto. Si alguna prueba falla,
    # el workflow marcará el pipeline como fallido.
    # Además, guardamos los resultados en formato TRX para que GitHub pueda
    # mostrarlos de forma amigable en la interfaz.
    - name: Run tests
      run: dotnet test --configuration Release --no-build --verbosity minimal --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

    # 9) Cierra la analítica de SonarCloud para finalizar el análisis y enviar
    # los resultados al proyecto configurado en SonarCloud.
    - name: End SonarCloud analysis
      if: ${{ env.SONAR_TOKEN != '' }}
      run: |
        export PATH="$PATH:$HOME/.dotnet/tools"
        dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"
    # 10) Publica los resultados de pruebas en GitHub como un Check/Status,
    # para que los estudiantes puedan ver en una vista organizada si hubo
    # fallas o éxito en cada ejecución del pipeline.
    - name: Publish test results
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: .NET test results
        path: 'TestResults/**/*.trx'
        reporter: dotnet-trx
